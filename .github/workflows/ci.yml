name: CI

on:
  push:
    branches: [master, main]
    # 纯文档改动（README 等）不影响构建与单测，不必跑流水线。
    paths-ignore:
      - '**.md'
  pull_request:

# 同一分支连续推送时，自动取消仍在排队/运行的旧任务，
# 避免多次提交后 CI 互相排队、白等前面那几次。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon
      # 只卡 error 不卡 warning：lint 的 warning 里混杂着大量风格建议，
      # 而 error 才是真问题（NewApi 低版本崩溃、Compose 组合期读状态等）。
      # 加上这一步是为了防止刚清理干净的 24 个 error 又悄悄长回来。
      - name: Lint (errors fail the build)
        run: ./gradlew :app:lintDebug --no-daemon
      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --no-daemon
